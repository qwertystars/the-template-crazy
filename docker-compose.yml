version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: flexibase-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flexibase_user
      POSTGRES_PASSWORD: flexibase_password
      POSTGRES_DB: flexibase_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flexibase_user -d flexibase_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flexibase-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://flexibase_user:flexibase_password@db:5432/flexibase_db
      SECRET_KEY: your-secret-key-change-in-production
      DEBUG: "True"
      ENVIRONMENT: development
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: flexibase-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Redis (Optional - for caching)
  redis:
    image: redis:7-alpine
    container_name: flexibase-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
